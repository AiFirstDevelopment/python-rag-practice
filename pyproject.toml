[project]
name = "python-rag-practice"
version = "0.1.0"
description = "Graded Python exercises, with a Claude Code tutor, from no Python to a RAG pipeline and its eval harness."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "pydantic>=2.14.4",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["exercises"]
